# 200 - Success
200=success
20001001=Logout successful
20002001=User created successfully
20002002=User updated successfully
20002003=User status updated successfully
20002004=Password changed successfully. Please login again.

# 400 - Common & Validation
40000001=Bad request
40000002=Activity logging error
40002001=Invalid input data
40002002=Username is required
40002003=Password is required
40002004=Full name is required
40002005=Username must be between 3 and 50 characters
40002006=Password must be at least 6 characters
40002007=Email format is invalid
40002008=Refresh token is required
40002009=Invalid status (only ACTIVE, INACTIVE, LOCKED, DELETED are allowed)
40002010=Full name must contain at least 2 words

# 401 - Unauthorized
40100001=Session expired, please login again
40100002=Authentication required
40100003=Invalid authentication token

# 403 - Forbidden
40300001=Access denied for this resource
40300002=Role not allowed

# 404 - Not Found
40400001=Requested resource not found

# 500 - Server Error
50000001=Internal server error

# 40003xxx - Auth Errors
40003001=Incorrect username or password
40003002=Incorrect username or password
40003003=Account is locked or inactive
40003004=Session has been revoked or does not exist

# 40004xxx - User Errors
40004001=Username already exists
40004002=Email is already in use
40004003=User not found
40004004=Department not found
