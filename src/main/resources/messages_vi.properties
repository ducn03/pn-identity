# 200 - Success
200=success
20001001=Đăng xuất thành công
20002001=Tạo tài khoản người dùng thành công
20002002=Cập nhật thông tin người dùng thành công
20002003=Cập nhật trạng thái người dùng thành công
20002004=Đổi mật khẩu thành công. Vui lòng đăng nhập lại.

# 400 - Common & Validation
40000001=Yêu cầu không hợp lệ
40000002=Lỗi ghi nhận nhật ký hoạt động
40002001=Dữ liệu nhập không hợp lệ
40002002=Tên đăng nhập không được để trống
40002003=Mật khẩu không được để trống
40002004=Họ và tên không được để trống
40002005=Tên đăng nhập phải từ 3 đến 50 ký tự
40002006=Mật khẩu phải từ 6 ký tự trở lên
40002007=Email không đúng định dạng
40002008=Refresh token không được để trống
40002009=Trạng thái không hợp lệ (chỉ chấp nhận ACTIVE, INACTIVE, LOCKED, DELETED)

# 401 - Unauthorized
40100001=Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
40100002=Yêu cầu xác thực tài khoản
40100003=Mã xác thực không hợp lệ

# 403 - Forbidden
40300001=Tài khoản không có quyền thực hiện chức năng này
40300002=Vai trò không được phép truy cập

# 404 - Not Found
40400001=Không tìm thấy tài nguyên yêu cầu

# 500 - Server Error
50000001=Đã xảy ra lỗi máy chủ nội bộ

# 40003xxx - Auth Errors
40003001=Tài khoản hoặc mật khẩu không chính xác
40003002=Tài khoản hoặc mật khẩu không chính xác
40003003=Tài khoản đang bị tạm khóa hoặc ngừng hoạt động
40003004=Phiên đăng nhập đã bị thu hồi hoặc không tồn tại

# 40004xxx - User Errors
40004001=Tên đăng nhập đã tồn tại trong hệ thống
40004002=Email này đã được sử dụng bởi tài khoản khác
40004003=Không tìm thấy thông tin tài khoản người dùng
40004004=Không tìm thấy thông tin phòng ban
